name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Print build environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;35.0.0|ndk;27.2.12479018|cmake;3.22.1" || true
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Run available unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest
      - name: Verify APK and report size/checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "::error::APK missing or empty: $APK"; exit 1; }
          ls -lh "$APK"
          sha256sum "$APK"
          unzip -l "$APK" | tail -n 8
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstraTerm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
