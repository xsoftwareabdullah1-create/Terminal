name: AstraTerm Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astraterm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test terminal.apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy SDK package 'tools' was removed and makes setup-android fail.
          packages: platform-tools
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
      - name: Install Android SDK, NDK, and CMake
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Print build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;35.0.0|ndk;27.2.12479018|cmake;3.22.1" || true
      - name: Clean, compile, and test
        run: gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug testDebugUnitTest
      - name: Name and verify APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          DEST="app/build/outputs/apk/debug/terminal.apk"
          test -s "$SOURCE" || { echo "::error::Build did not create $SOURCE"; exit 1; }
          cp "$SOURCE" "$DEST"
          test -s "$DEST"
          du -h "$DEST"
          sha256sum "$DEST"
          unzip -l "$DEST" | grep -E 'lib/[^/]+/libastraterm.so' || true
      - name: Upload terminal.apk
        uses: actions/upload-artifact@v4
        with:
          name: terminal-apk
          path: app/build/outputs/apk/debug/terminal.apk
          if-no-files-found: error
          retention-days: 30
